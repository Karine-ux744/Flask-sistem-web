<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block titulo_pagina %}{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link href="/static/style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <nav class="d-flex justify-content-between py-2 px-4 fundo-azul-escuro">
        <a
          href="{{url_for('homepage')}}"
          class="logo d-flex justify-content-between align-items-center column-gap-2 text-white text-decoration-none"
          ><i class="bi bi-rocket-takeoff fs-3"></i>
          <p class="d-flex mb-0 fw-bold fs-3">Flask System</p></a
        >
        <div class="d-flex column-gap-5 align-items-center">
          <div class="d-flex column-gap-3">
            <a
              href="{{url_for('homepage')}}"
              class="text-white text-decoration-none"
              >Início</a
            >
            <a href="#" class="text-white text-decoration-none">Sobre</a>
            <a href="#" class="text-white text-decoration-none">Recursos</a>
            <a href="#" class="text-white text-decoration-none">Tecnologias</a>
          </div>
          <div class="d-flex column-gap-3">
            <a
              href="{{url_for('login')}}"
              class="text-white text-decoration-none btn btn-outline-primary"
              >Login</a
            >
            <a
              href="{{url_for('cadastro')}}"
              class="text-white text-decoration-none btn btn-primary"
              >Criar conta</a
            >
          </div>
        </div>
      </nav>
    </header>
    {% block body %}{% endblock %}
    <footer
      class="fundo-azul-escuro d-flex justify-content-center column-gap-2 py-2"
    >
      <div
        class="d-flex flex-column justify-content-start align-items-start w-100"
      >
        <a
          href="{{url_for('homepage')}}"
          class="logo d-flex justify-content-between align-items-center column-gap-2 text-white text-decoration-none"
          ><i class="bi bi-rocket-takeoff fs-3"></i>
          <p class="d-flex mb-0 fw-bold fs-3">Flask System</p></a
        >

        <p>Um projeto educacional para aprender Flask do zero ao avançado.</p>
        <div>
          <a href="https://github.com/Karine-ux744" target="_blank"
            ><i class="bi bi-github"></i
          ></a>
          <a href="https://www.linkedin.com/in/karineangel/" target="_blank"
            ><i class="bi bi-linkedin"></i
          ></a>
          <a href="mailto:karine@email.com" target="_blank"
            ><i class="bi bi-envelope-at-fill"></i
          ></a>
          <a href="https://wa.me/5531998972774" target="_blank"
            ><i class="bi bi-whatsapp"></i
          ></a>
        </div>
      </div>
      <div
        class="d-flex flex-column justify-content-start align-items-start w-100"
      >
        <p class="fw-semibold">Navegação</p>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Recursos</a>
        <a href="#">Tecnologias</a>
      </div>
      <div
        class="d-flex flex-column justify-content-start align-items-start w-100"
      >
        <p class="fw-semibold">Recursos</p>
        <a href="#">Documentação</a>
        <a href="#">GitHub</a>
        <a href="#">Contato</a>
        <a href="#"></a>
      </div>
      <hr />
    </footer>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
